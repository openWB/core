name: Python application

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Check Raspberry Pi dependency wheels
        run: |
          grep -E '^(jq|evdev)==' requirements.txt |
            python -m pip download --only-binary=:all: --no-deps \
              --platform linux_armv7l --implementation cp \
              --python-version "${{ matrix.python-version }}" \
              --extra-index-url https://www.piwheels.org/simple \
              --dest "${RUNNER_TEMP}/armv7-wheels" -r /dev/stdin
      - name: Flake8 with annotations in packages folder
        uses: TrueBrain/actions-flake8@v2.4
        with:
          path: packages
          flake8_version: "7.3.0"
      - name: Flake8 with annotations in runs folder
        uses: TrueBrain/actions-flake8@v2.4
        with:
          path: runs
          flake8_version: "7.3.0"
      - name: Test with pytest
        run: |
          PYTHONPATH=packages python -m pytest packages --log-cli-level=DEBUG
          PYTHONPATH=runs python -m pytest packages --log-cli-level=DEBUG
